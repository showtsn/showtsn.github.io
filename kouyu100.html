<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>口语100操作流程</title>
	<link rel="stylesheet" href="./css/kouyu100.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>口语100操作流程</h1>
            <div class="controls">
                <button class="btn btn-prev" id="prev-btn">
                    <span>上一张</span>
                </button>
                <button class="btn btn-next" id="next-btn">
                    <span>下一张</span>
                </button>
				<span class="counter">
				<span id="current-index">1</span> / <span id="total-count">5</span>
				</span>
            </div>			
         </header>
        
        <main>
            <div class="image-viewer">
                <div class="image-container">
                    <img id="current-image" src="" alt="当前图片" class="fade-in">
                </div>
            </div>

            <div class="image-info">
                <span class="image-title" id="image-title">图片标题</span> ： 
                <span class="image-desc" id="image-desc">图片描述</span>
            </div>
 
            <div class="thumbnail-container" id="thumbnail-container">
                <!-- 缩略图将通过JS动态生成 -->
            </div>
        </main>
        
        <footer>
            <p>2025年整理　|　支持键盘方向键操作</p>
        </footer>
    </div>
	<script src="./js/kouyu100.js"></script>
</body>
</html>
